<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkSMM Theme Preview Source</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 590px; height: 300px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      color: #ffffff;
      background: #0b1533 url("generated-theme-preview-source.png") center / cover no-repeat;
      font-family: Arial, Helvetica, sans-serif;
    }
    body::before {
      position: absolute;
      inset: 0;
      content: "";
      background: linear-gradient(90deg, rgba(7, 16, 42, 0.98) 0%, rgba(7, 16, 42, 0.92) 42%, rgba(7, 16, 42, 0.28) 73%, rgba(7, 16, 42, 0.16) 100%);
    }
    .copy { position: absolute; z-index: 2; top: 25px; left: 28px; width: 286px; }
    .logo { width: 111px; height: auto; margin-bottom: 25px; }
    .eyebrow {
      margin: 0 0 9px;
      color: #93c5fd;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: 29px; line-height: 1.04; letter-spacing: -1.25px; }
    h1 span { color: #60a5fa; }
    .summary { width: 265px; margin: 12px 0 16px; color: #cbd8f4; font-size: 11px; line-height: 1.5; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips span {
      padding: 6px 8px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .browser {
      position: absolute;
      z-index: 2;
      top: 48px;
      right: 21px;
      width: 275px;
      height: 205px;
      padding: 7px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.42);
      transform: perspective(800px) rotateY(-4deg) rotateX(1deg);
    }
    .browser::before {
      display: block;
      width: 100%;
      height: 12px;
      content: "";
      border-radius: 6px 6px 0 0;
      background: linear-gradient(90deg, #e5eaf4 0 28%, #f8fafc 28% 72%, #e5eaf4 72%);
    }
    .browser img { width: 100%; height: 179px; object-fit: cover; object-position: top; }
    .accent {
      position: absolute;
      z-index: 3;
      right: 12px;
      bottom: 19px;
      padding: 8px 11px;
      color: #0b1533;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
      font-size: 8px;
      font-weight: 800;
    }
  </style>
</head>

<body>
  <section class="copy">
    <img class="logo" src="../assets/images/logo-white.svg" alt="LinkSMM">
    <p class="eyebrow">SMM &amp; Digital Services Marketplace</p>
    <h1>Modern HTML Template for <span>Digital Growth</span></h1>
    <p class="summary">Present services, packages, content, and customer journeys with a focused marketplace design.</p>
    <div class="chips"><span>21 HTML PAGES</span><span>2 HOMEPAGES</span><span>FULLY RESPONSIVE</span></div>
  </section>
  <div class="browser"><img src="showcase-home-one.png" alt="LinkSMM homepage preview"></div>
  <span class="accent">BOOTSTRAP 5 + SCSS</span>
</body>

</html>
