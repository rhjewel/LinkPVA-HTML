<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkSMM Thumbnail Source</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 80px; height: 80px; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background: #0b1533 url("generated-thumbnail-source.png") center / cover no-repeat;
    }
    body::before {
      position: fixed;
      inset: 0;
      content: "";
      background: linear-gradient(145deg, rgba(11, 21, 51, 0.2), rgba(11, 21, 51, 0.58));
    }
    .brand-mark {
      position: relative;
      width: 54px;
      height: 54px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.82);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(8px);
    }
    .brand-mark img { width: auto; max-width: none; height: 54px; margin: -2px 0 0 -2px; }
  </style>
</head>

<body>
  <div class="brand-mark">
    <img src="../assets/images/logo-white.svg" alt="LinkSMM">
  </div>
</body>

</html>
